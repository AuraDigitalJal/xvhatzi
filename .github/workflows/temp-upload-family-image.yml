name: temp upload family image
on:
  push:
    branches:
      - fix/subir-banner-mayra-jpg
permissions:
  contents: write
jobs:
  upload:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subir-banner-mayra-jpg
      - name: Download corrected family image
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "https://at.adobe.com/7ZlgfbIXw9ErCUGy" -o assets/banner-extra.jpg
          test -s assets/banner-extra.jpg
          python - <<'PY'
          from pathlib import Path
          p=Path("assets/banner-extra.jpg")
          b=p.read_bytes()
          assert len(b) > 100000, f"file too small: {len(b)}"
          assert b[:2] == b"\xff\xd8", "downloaded file is not JPEG"
          print("JPEG OK", len(b))
          PY
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-extra.jpg
          git commit -m "Agregar imagen corregida de papás y padrinos"
          git push origin HEAD:fix/subir-banner-mayra-jpg
